short_bio: >-
  <p>
    My name is Danilo Ferreira, and I am currently a postdoctoral researcher at the Laboratório Nacional de Astrofísica (LNA), 
    Brazil. I work in observational stellar astrophysics, with a focus on massive stars, particularly Be stars and hierarchical 
    multiple systems, using photometric, spectroscopic, and interferometric data in the optical and near-infrared. 
  <p>
  <p>  
    I hold a PhD 
    in Astronomy from the Observatório Nacional (2025), including a research internship at the Observatoire de Paris (2024), as 
    well as an MSc in Astrophysics and a BSc in Physics. Alongside research, I am actively involved in science outreach and education. 
  <p>
  <p>  
    Outside academia, I enjoy listening to music (MPB and Brazilian rock), going to the beach, and playing electronic games.
  </p>

